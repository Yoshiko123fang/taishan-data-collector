<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>数据回收 · 汇总端</title>
<style>
  :root{ --teal:#028090; --sea:#00A896; --mint:#02C39A; --ink:#16323A; --mute:#5E7177; --bg:#F4F8F7; --warn:#E0563B; }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:"Microsoft YaHei","PingFang SC",sans-serif; background:var(--bg); color:var(--ink); }
  .wrap{ max-width:1180px; margin:0 auto; padding:24px 18px 60px; }
  header{ background:linear-gradient(120deg,var(--teal),var(--sea)); color:#fff; padding:22px; border-radius:16px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; }
  header h1{ margin:0; font-size:22px; }
  .btn{ background:#fff; color:var(--teal); border:none; border-radius:9px; padding:10px 14px; font-weight:700; cursor:pointer; font-size:13px; margin-left:8px; }
  .btn.primary{ background:var(--ink); color:#fff; }
  .btn.danger{ background:#fff; color:var(--warn); border:1px solid var(--warn); }
  .card{ background:#fff; border:1px solid #E2ECEA; border-radius:14px; padding:18px; margin-top:18px; overflow:auto; }
  .login{ max-width:380px; margin:80px auto; background:#fff; padding:28px; border-radius:14px; box-shadow:0 6px 30px rgba(0,0,0,.08); }
  .login input{ width:100%; padding:11px 12px; border:1px solid #CBD8D6; border-radius:9px; font-size:15px; }
  table{ border-collapse:collapse; width:100%; font-size:13px; }
  th,td{ border:1px solid #E2ECEA; padding:8px 10px; text-align:left; vertical-align:top; }
  th{ background:#EAF4F2; color:var(--teal); position:sticky; top:0; }
  a.flink{ color:var(--sea); text-decoration:none; }
  .bar{ display:flex; align-items:center; gap:8px; margin:6px 0; font-size:13px; }
  .bar .lab{ width:200px; flex:none; color:var(--mute); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .bar .track{ flex:1; background:#EAF4F2; border-radius:6px; height:18px; overflow:hidden; }
  .bar .fill{ height:100%; background:linear-gradient(90deg,var(--sea),var(--mint)); }
  .bar .num{ width:36px; text-align:right; color:var(--ink); }
  .sec-title{ font-weight:700; color:var(--teal); margin:18px 0 8px; font-size:15px; border-left:4px solid var(--mint); padding-left:10px; }
  .task-stat{ background:#FBFEFD; border:1px solid #D8ECE8; border-radius:10px; padding:10px 14px; margin:10px 0; }
  .task-stat .tt{ font-weight:700; color:var(--teal); font-size:14px; margin-bottom:4px; }
  .reason{ font-size:12px; color:var(--warn); margin:2px 0 0 8px; }
  .hidden{ display:none; }
  .err{ color:#B23A1E; font-size:13px; margin-top:8px; }
  .ok-badge{ color:#02735E; font-weight:700; }
  .no-badge{ color:var(--warn); font-weight:700; }
  .del-btn{ background:var(--warn); color:#fff; border:none; border-radius:7px; padding:5px 9px; font-size:12px; cursor:pointer; }
  .hint{ font-size:12px; color:var(--mute); }
</style>
<script src="vendor/xlsx.full.min.js"></script>
<script src="vendor/jszip.min.js"></script>
<script src="app-config.js"></script>
</head>
<body>
<div class="wrap hidden">
  <header>
    <h1>数据回收 · 汇总端</h1>
    <div>
      <button class="btn" onclick="dlZip()">批量下载文档(zip)</button>
      <button class="btn primary" onclick="dlExcel()">导出 Excel</button>
      <button class="btn danger" onclick="clearAll()">清空全部数据</button>
    </div>
  </header>

  <div class="card" id="statsCard">
    <div class="sec-title">实操任务达成情况</div>
    <div id="taskStats"></div>
    <div class="sec-title">调查问卷统计</div>
    <div id="stats"></div>
  </div>

  <div class="card">
    <div class="sec-title">全部提交数据</div>
    <div style="overflow:auto"><table id="tbl"></table></div>
  </div>
</div>

<div class="login" id="loginBox">
  <h2 style="margin-top:0;color:var(--teal)">汇总端登录</h2>
  <p style="color:var(--mute);font-size:13px">请输入查看密码</p>
  <input type="password" id="pwd" placeholder="密码" />
  <div class="err hidden" id="loginErr">密码错误</div>
  <button class="btn primary" style="width:100%;margin-top:14px" onclick="doLogin()">登录</button>
</div>

<script>
const SB = SUPABASE_URL, ANON = SUPABASE_ANON;
const CFG = { basicInfoFields, tasks, questionnaire, taskDoc };
let ROWS = [];
function sbHeaders(extra){ return Object.assign({'apikey':ANON,'Authorization':'Bearer '+ANON}, extra||{}); }

function doLogin(){
  const pwd = document.getElementById('pwd').value;
  if(pwd !== SUMMARY_PW){ document.getElementById('loginErr').classList.remove('hidden'); return; }
  try{ localStorage.setItem('summary_ok','1'); }catch(e){}
  document.getElementById('loginBox').classList.add('hidden');
  document.querySelector('.wrap').classList.remove('hidden');
  loadData();
}
if(localStorage.getItem('summary_ok') === '1'){
  document.getElementById('loginBox').classList.add('hidden');
  document.querySelector('.wrap').classList.remove('hidden');
  loadData();
}

async function loadData(){
  const r = await fetch(`${SB}/rest/v1/submissions?select=*&order=created_at.asc`, { headers: sbHeaders() });
  if(!r.ok){ alert('加载失败：'+r.status); return; }
  ROWS = await r.json();
  renderTaskStats(); renderStats(); renderTable();
}

function renderTaskStats(){
  const box=document.getElementById('taskStats'); box.innerHTML='';
  const active = CFG.tasks.filter(t=>!t.pending);
  if(!ROWS.length){ box.innerHTML='<div class="hint">暂无提交数据</div>'; return; }
  active.forEach(t=>{
    let yes=0, no=0; const reasons=[];
    ROWS.forEach(r=>{ const fb=r.tasks&&r.tasks[t.id]; if(fb&&fb.achieved==='yes') yes++; else if(fb&&fb.achieved==='no'){ no++; if(fb.reason) reasons.push(fb.reason); } });
    const total=yes+no; const yesPct= total?Math.round(yes/total*100):0; const noPct= total?Math.round(no/total*100):0;
    const card=document.createElement('div'); card.className='task-stat';
    let html=`<div class="tt">${t.title}</div>`;
    html+=`<div class="bar"><div class="lab">能完成</div><div class="track"><div class="fill" style="width:${yesPct}%"></div></div><div class="num">${yes}</div></div>`;
    html+=`<div class="bar"><div class="lab">未能完成</div><div class="track"><div class="fill" style="width:${noPct}%;background:linear-gradient(90deg,#E08A6E,#E0563B)"></div></div><div class="num">${no}</div></div>`;
    card.innerHTML=html; box.appendChild(card);
    reasons.forEach(rs=>{ const p=document.createElement('div'); p.className='reason'; p.textContent='· '+rs; box.appendChild(p); });
  });
}
function renderStats(){
  const box=document.getElementById('stats'); box.innerHTML='';
  if(!ROWS.length){ box.innerHTML='<div class="hint">暂无问卷数据</div>'; return; }
  const count=(q,val)=>ROWS.filter(r=>{ const a=r.questionnaire&&r.questionnaire[q.id]; if(q.type==='multi') return Array.isArray(a)&&a.includes(val); return a===val; }).length;
  const draw=(q)=>{
    const max=Math.max(1,...q.options.map(o=>count(q,o)));
    q.options.forEach(o=>{
      const c=count(q,o);
      const row=document.createElement('div'); row.className='bar';
      row.innerHTML=`<div class="lab" title="${o}">${o}</div><div class="track"><div class="fill" style="width:${c/max*100}%"></div></div><div class="num">${c}</div>`;
      box.appendChild(row);
    });
  };
  CFG.questionnaire.forEach(q=>{
    const t=document.createElement('div'); t.className='sec-title'; t.style.marginTop='10px'; t.textContent=q.question; box.appendChild(t);
    if(q.type==='text'){
      ROWS.forEach(r=>{ const a=r.questionnaire&&r.questionnaire[q.id]; if(a){ const p=document.createElement('div'); p.style.fontSize='13px'; p.style.color='var(--mute)'; p.style.margin='3px 0'; p.textContent='· '+a; box.appendChild(p); } });
    } else draw(q);
  });
}
function fileLinks(r){
  const files=(r.files||[]);
  if(!files.length) return '—';
  return files.map(f=>`<a class="flink" href="${SB}/storage/v1/object/uploads/${encodeURIComponent(f.stored)}?download=${encodeURIComponent(f.name)}" target="_blank">${f.name}</a>`).join('<br>');
}
function renderTable(){
  const tbl=document.getElementById('tbl'); tbl.innerHTML='';
  const head=document.createElement('tr');
  const cols=['#','提交时间',...CFG.basicInfoFields.map(f=>f.label)];
  CFG.tasks.forEach(t=>{ if(!t.pending){ cols.push(t.title+'·能否完成'); cols.push(t.title+'·原因'); } });
  cols.push(...CFG.questionnaire.map(q=>q.question));
  cols.push('文档'); cols.push('操作');
  cols.forEach(h=>{ const th=document.createElement('th'); th.textContent=h; head.appendChild(th); });
  tbl.appendChild(head);
  ROWS.forEach((r,i)=>{
    const tr=document.createElement('tr');
    const cells=[String(i+1), (r.created_at||'').replace('T',' ').slice(0,19)];
    CFG.basicInfoFields.forEach(f=>cells.push((r.basic_info&&r.basic_info[f.key])??''));
    CFG.tasks.forEach(t=>{ if(t.pending) return; const fb=r.tasks?r.tasks[t.id]:undefined;
      if(fb&&fb.achieved==='yes') cells.push('<span class="ok-badge">能完成</span>');
      else if(fb&&fb.achieved==='no') cells.push('<span class="no-badge">未能完成</span>');
      else cells.push('—');
      cells.push(fb&&fb.reason?fb.reason:''); });
    CFG.questionnaire.forEach(q=>{ const a=r.questionnaire?r.questionnaire[q.id]:undefined; cells.push(Array.isArray(a)?a.join('、'):(a??'')); });
    cells.push(fileLinks(r));
    cells.push(`<button class="del-btn" onclick="delRow('${r.id}')">删除</button>`);
    cells.forEach(c=>{ const td=document.createElement('td'); td.innerHTML=c; tr.appendChild(td); });
    tbl.appendChild(tr);
  });
}

async function delRow(id){
  if(!confirm('确定删除这条提交记录及其附件吗？')) return;
  const row = ROWS.find(x=>x.id===id);
  for(const f of (row.files||[])){
    await fetch(`${SB}/storage/v1/object/uploads/${encodeURIComponent(f.stored)}`, {method:'DELETE', headers:sbHeaders()}).catch(()=>{});
  }
  const r=await fetch(`${SB}/rest/v1/submissions?id=eq.${id}`, {method:'DELETE', headers:sbHeaders()});
  if(r.ok) loadData(); else alert('删除失败');
}
async function clearAll(){
  if(!confirm('确定清空全部提交记录与附件吗？此操作不可恢复！')) return;
  for(const r of ROWS){
    for(const f of (r.files||[])){
      await fetch(`${SB}/storage/v1/object/uploads/${encodeURIComponent(f.stored)}`, {method:'DELETE', headers:sbHeaders()}).catch(()=>{});
    }
    await fetch(`${SB}/rest/v1/submissions?id=eq.${r.id}`, {method:'DELETE', headers:sbHeaders()}).catch(()=>{});
  }
  loadData();
}

async function dlZip(){
  if(typeof JSZip==='undefined'){ alert('JSZip 未加载，请改用单个文件下载'); return; }
  const zip=new JSZip(); let n=0; const used=new Set();
  for(const r of ROWS){
    for(const f of (r.files||[])){
      let base=`${n+1}_${f.name}`;
      while(used.has(base)){ base=`${n+1}_${Math.random().toString(36).slice(2,6)}_${f.name}`; }
      used.add(base);
      const blob=await (await fetch(`${SB}/storage/v1/object/uploads/${encodeURIComponent(f.stored)}`, {headers:sbHeaders()})).blob();
      zip.file(base, blob); n++;
    }
  }
  if(n===0){ alert('没有可下载的文档'); return; }
  const content=await zip.generateAsync({type:'blob'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(content); a.download='全部文档.zip'; a.click();
}
function dlExcel(){
  if(typeof XLSX==='undefined'){ alert('Excel 组件未加载'); return; }
  const aoa=[['#','提交时间',...CFG.basicInfoFields.map(f=>f.label)]];
  CFG.tasks.forEach(t=>{ if(!t.pending){ aoa[0].push(t.title+'·能否完成'); aoa[0].push(t.title+'·原因'); } });
  aoa[0].push(...CFG.questionnaire.map(q=>q.question)); aoa[0].push('文档');
  ROWS.forEach((r,i)=>{
    const row=[i+1,(r.created_at||'').replace('T',' ').slice(0,19)];
    CFG.basicInfoFields.forEach(f=>row.push((r.basic_info&&r.basic_info[f.key])??''));
    CFG.tasks.forEach(t=>{ if(t.pending) return; const fb=r.tasks?r.tasks[t.id]:undefined;
      row.push(fb&&fb.achieved==='yes'?'能完成':(fb&&fb.achieved==='no'?'未能完成':''));
      row.push(fb&&fb.reason?fb.reason:''); });
    CFG.questionnaire.forEach(q=>{ const a=r.questionnaire?r.questionnaire[q.id]:undefined; row.push(Array.isArray(a)?a.join('、'):(a??'')); });
    row.push((r.files||[]).map(f=>f.name).join('; '));
    aoa.push(row);
  });
  const ws=XLSX.utils.aoa_to_sheet(aoa);
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, '数据汇总');
  XLSX.writeFile(wb, '数据汇总.xlsx');
}
</script>
</body>
</html>
